<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>統計｜MoneyBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script type="module" src="./js/stats.js"></script>
</head>
<body data-requires-settings>
  <main id="main" class="page-shell">
    <header class="page-heading">
      <div><h1>統計</h1><p id="month-label" class="secondary mb-0"></p></div>
      <a class="btn btn-outline-secondary" href="./index.html">查看月明細</a>
    </header>
    <div class="d-flex flex-wrap align-items-end gap-2 mb-3" role="group" aria-label="月份切換">
      <button class="btn btn-outline-secondary" id="previous-month" type="button" disabled>上月</button>
      <div>
        <label class="form-label mb-1" for="month-picker">月份</label>
        <input class="form-control" id="month-picker" type="month" min="0001-01" max="9999-12" placeholder="YYYY-MM" disabled>
      </div>
      <button class="btn btn-outline-secondary" id="next-month" type="button" disabled>下月</button>
    </div>
    <p id="stats-loading" class="secondary" role="status" hidden>
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>正在載入統計…
    </p>
    <div id="stats-error" class="alert alert-danger" hidden>
      <p id="stats-error-message" class="mb-2" role="alert"></p>
      <button class="btn btn-sm btn-outline-danger" id="stats-retry" type="button">重新載入</button>
      <a class="btn btn-sm btn-outline-secondary" href="./settings.html">前往設定</a>
    </div>
    <p id="chart-warning" class="alert alert-warning" role="status" hidden>圖表暫時無法載入，下方仍可查看統計數字。</p>
    <div id="stats-content" hidden>
      <div class="chart-grid">
        <section class="surface overflow-hidden" aria-labelledby="category-chart-heading">
          <h2 id="category-chart-heading">支出分類</h2>
          <p id="no-expenses" class="secondary mb-0" role="status" hidden>本月無支出</p>
          <div id="category-chart-wrap" class="ratio ratio-4x3 mb-3" hidden><canvas id="category-chart" aria-hidden="true"></canvas></div>
          <div id="categories-wrap" class="table-responsive" hidden>
            <table class="table table-sm align-middle mb-0" aria-label="支出分類金額與占比">
              <thead><tr><th scope="col">分類</th><th scope="col" class="text-end">金額</th><th scope="col" class="text-end">占比</th></tr></thead>
              <tbody id="category-totals"></tbody>
            </table>
          </div>
        </section>
        <section class="surface overflow-hidden" aria-labelledby="totals-chart-heading">
          <h2 id="totals-chart-heading">收入與支出比較</h2>
          <div id="totals-chart-wrap" class="ratio ratio-4x3 mb-3" hidden><canvas id="totals-chart" aria-hidden="true"></canvas></div>
          <dl class="d-flex flex-wrap gap-4 mb-0">
            <div><dt>總收入</dt><dd class="mb-0" id="stats-income">—</dd></div>
            <div><dt>總支出</dt><dd class="mb-0" id="stats-expense">—</dd></div>
          </dl>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
