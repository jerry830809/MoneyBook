<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設定｜MoneyBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/settings.js"></script>
</head>
<body>
  <main id="main" class="page-shell page-shell-narrow">
    <header class="page-heading"><h1>設定</h1></header>
    <section class="surface" aria-labelledby="settings-heading">
      <h2 id="settings-heading">Airtable 設定</h2>
      <p class="secondary">設定儲存在此網站的瀏覽器儲存空間。請在你的個人裝置上使用。</p>
      <p id="settings-state" class="settings-state" role="status">尚未完成設定</p>
      <form id="settings-form" novalidate>
        <div class="mb-4">
          <label class="form-label" for="token">Airtable Token（權杖）</label>
          <input class="form-control" type="password" id="token" required autocomplete="off" spellcheck="false" aria-describedby="token-hint token-error">
          <div id="token-hint" class="form-text">輸入個人存取權杖。</div>
          <div id="token-error" class="invalid-feedback"></div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="base-id">Base ID（資料庫識別碼）</label>
          <input class="form-control" type="text" id="base-id" required autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="base-id-error">
          <div id="base-id-error" class="invalid-feedback"></div>
        </div>
        <div class="settings-actions">
          <button class="btn btn-primary" type="submit">儲存設定</button>
          <button class="btn btn-outline-danger" type="button" id="clear-settings" disabled>清除設定</button>
        </div>
      </form>
      <div id="settings-feedback" class="alert settings-feedback" role="alert" hidden></div>
    </section>
  </main>
</body>
</html>
